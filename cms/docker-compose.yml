# 85pi で動かす CMS。~/85store-cms に置き、.env（.env.example 参照）を用意して
#   docker compose up -d --build
# 管理画面: https://cms.85-store.com（DNS は CMS の端末の tailnet のアドレス。tailnet 内からのみ届く）
services:
  # tailnet に「cms」という端末として参加し、443 番を Caddy に転送する（PROXY プロトコルで接続元のアドレスを渡す）
  tailscale:
    image: tailscale/tailscale:stable
    hostname: cms
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--advertise-tags=tag:cms
      # 85crm の内部 API（85pi.<tailnet>.ts.net）を名前で引くため、MagicDNS を使う
      - TS_ACCEPT_DNS=true
      # Payload が接続元の利用者を問い合わせる（whois）ために、LocalAPI のソケットを共有する
      - TS_SOCKET=/var/run/ts/tailscaled.sock
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-sock:/var/run/ts
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin

  # cms.85-store.com の TLS を終端する（証明書は Let's Encrypt から DNS で取る）
  caddy:
    image: 85store-cms-caddy:latest
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      # Cloudflare の API トークン（85-store.com の DNS の編集だけ）。.env から渡す
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    network_mode: service:tailscale
    depends_on:
      - tailscale

  payload:
    # イメージは手元の PC で arm64 向けにビルドして送る（deploy.sh）。85pi でビルドすると負荷で落ちることがあるため
    image: 85store-cms-payload:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=file:/data/payload.db
      # 新しく撮った商品写真の一時置き場（Shopify に上げたら消す）
      - PRODUCT_PHOTOS_DIR=/data/product-photos
      - TAILSCALE_SOCKET=/var/run/ts/tailscaled.sock
    volumes:
      - cms-data:/data
      - tailscale-sock:/var/run/ts
    # ポートはホストに出さない。tailscale と同じネットワークで 127.0.0.1:3000 だけで待ち受ける
    network_mode: service:tailscale
    depends_on:
      - tailscale

  litestream:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: replicate
    env_file: .env
    volumes:
      - cms-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro

volumes:
  tailscale-state:
  tailscale-sock:
  caddy-data:
  caddy-config:
  cms-data:
