# 85pi で動かす tsidp（Tailscale の ID でログインする OIDC プロバイダー）
# Cloudflare Access のログイン方法として使う。Funnel を有効にしても、tsidp は tailnet の外からの
# ログイン（/authorize）を拒否するので、tailnet 内の端末からしかログインできない。
#
# 使い方: 同じディレクトリに .env を作り TS_AUTHKEY=tskey-auth-... を書いてから
#   docker compose up -d
services:
  tsidp:
    container_name: tsidp
    image: ghcr.io/tailscale/tsidp:latest
    restart: unless-stopped
    volumes:
      - tsidp-data:/data
    environment:
      - TAILSCALE_USE_WIP_CODE=1 # tsidp は v1.0 未満のため必要
      - TS_STATE_DIR=/data # 状態を永続化する（ないと再起動のたびに再登録される）
      - TS_HOSTNAME=idp # https://idp.<tailnet>.ts.net になる
      - TSIDP_USE_FUNNEL=1 # Cloudflare からトークン交換できるように公開する
      - TS_AUTHKEY=${TS_AUTHKEY}
volumes:
  tsidp-data:
